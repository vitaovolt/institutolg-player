name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, gd, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Backend — .env
        working-directory: code/backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Backend — Composer
        working-directory: code/backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Backend — key e permissões
        working-directory: code/backend
        run: |
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Frontend — npm ci e build
        working-directory: code/frontend
        run: |
          npm ci
          npm run build

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'app_testing'" | grep -q 1 || PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE app_testing;"

      - name: Backend — PHPUnit
        working-directory: code/backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: app_testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          FRONTEND_URL: http://localhost:5173
        run: vendor/bin/phpunit
