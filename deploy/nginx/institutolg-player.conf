# Nginx — painel SPA + API + player público (Laravel web)
# Instalar:
#   sudo cp deploy/nginx/institutolg-player.conf /etc/nginx/sites-available/institutolg-player.conf
#   sudo ln -sf /etc/nginx/sites-available/institutolg-player.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d institutolgplayer.educraft.com.br
#
# Não copiar o vhost só-/api do Gestor Job: /assistir, /eduq e /capa são PHP, não SPA.

server {
    listen 80;
    listen [::]:80;
    server_name institutolgplayer.educraft.com.br;

    root /var/www/institutolg-player/code/frontend/dist;
    index index.html;

    # PUT único (PC/local). Produção: MP4 grande vai direto ao objeto (partes), não pelo PHP.
    client_max_body_size 35g;
    client_body_timeout 3600s;
    # Proxy na frente (padrão ~90 s). Nginx default 75 s fecha antes → TTFB 15–50 s / 522.
    keepalive_timeout 130s;
    keepalive_requests 1000;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/institutolg-player/code/frontend/dist;
        default_type "text/plain";
        allow all;
    }

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/institutolg-player/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/institutolg-player/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 3600;
        fastcgi_hide_header X-Powered-By;
    }

    # Player público (iframe Eduq) + mídia assinada + capa. Sem isto a SPA engole a rota.
    location ^~ /assistir {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/institutolg-player/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/institutolg-player/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /eduq {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/institutolg-player/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/institutolg-player/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /capa {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/institutolg-player/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/institutolg-player/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_hide_header X-Powered-By;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/institutolg-player/code/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/institutolg-player/code/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Hash do Vite: arquivo ou 404. Sem isto, JS ausente vira index.html (200) e a SPA não sobe.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
